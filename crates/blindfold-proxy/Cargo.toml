[package]
name = "blindfold-proxy"
description = "Bounded application-level HTTP proxy for Blindfold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
serde_json = "1.0.149"
tokio = { version = "1.52.0", default-features = false, features = [
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.52.0", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints]
workspace = true
