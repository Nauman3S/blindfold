manifest_version = 1
id = "dev.blindfold.opencode"
version = "0.1.0"
kind = "harness-adapter"
protocol = "builtin-v1"
entrypoint = "builtin/opencode"

[harness]
command = "opencode"
version = "=1.17.3"
noninteractive_modes = ["run"]

[capabilities]
providers = ["open-ai", "anthropic", "open-router"]
transports = ["http-json", "server-sent-events"]
events = ["model-request", "model-response", "command-output"]

[permissions]
filesystem = ["workspace-read", "workspace-write", "session-temp"]
network = ["model-proxy", "policy-egress"]
environment = ["path", "home", "temp", "locale", "terminal", "user-identity", "shell", "host-config"]
spawn_harness = true
spawn_tools = true
